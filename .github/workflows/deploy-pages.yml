name: Publicar jogo web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pygbag
      - run: python tools/build_web_source.py
      # O navegador libera áudio somente depois de um clique/toque. Sem
      # --ume_block=0, o Pygbag aguarda essa interação antes de iniciar o jogo.
      - run: python -m pygbag --build .web-source
      - run: python tools/patch_pygbag_html.py .web-source/build/web/index.html "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .web-source/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
